{% extends "base.html" %}
{% block title %}Nueva Dirección — Beer House{% endblock %}

{% block content %}
<div class="bh-page-header">
    <h2>Agregar Nueva Dirección</h2>
    <a href="{{ url_for('cuenta.direcciones') }}" class="bh-btn-link">&larr; Volver a Mis Direcciones</a>
</div>

<div class="bh-form-container">
    <form method="POST" action="{{ url_for('cuenta.nueva_direccion') }}" class="bh-form-card">
        <div class="bh-form-row">
            <div class="bh-field bh-col-6">
                <label for="alias">Alias de la dirección (opcional)</label>
                <input type="text" id="alias" name="alias" placeholder="Ej. Casa, Oficina, Bar">
            </div>
            <div class="bh-field bh-col-6">
                <label for="ciudad">Ciudad *</label>
                <input type="text" id="ciudad" name="ciudad" placeholder="Ej. Bogotá, Medellín, Cali" required>
            </div>
        </div>

        <div class="bh-field">
            <label for="linea_direccion">Dirección completa *</label>
            <input type="text" id="linea_direccion" name="linea_direccion" placeholder="Calle / Carrera / Avenida # - Apto o Casa" required>
        </div>

        <div class="bh-form-row">
            <div class="bh-field bh-col-6">
                <label for="departamento">Departamento / Estado</label>
                <input type="text" id="departamento" name="departamento" placeholder="Ej. Cundinamarca, Antioquia">
            </div>
            <div class="bh-field bh-col-6">
                <label for="codigo_postal">Código Postal (opcional)</label>
                <input type="text" id="codigo_postal" name="codigo_postal" placeholder="Ej. 110111">
            </div>
        </div>

        <div class="bh-field bh-checkbox-field">
            <label>
                <input type="checkbox" name="es_principal" value="1">
                Establecer como dirección principal de entrega
            </label>
        </div>

        <div class="bh-form-actions">
            <button type="submit" class="bh-btn bh-btn-primary">Guardar Dirección</button>
            <a href="{{ url_for('cuenta.direcciones') }}" class="bh-btn bh-btn-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
