<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Acceso restringido — Beer House</title>
    <!-- Mismo CSS y tipografías que base.html; sin menú ni enlaces para no saltarse la verificación -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="age-gate-body">
    <main class="age-gate">
        <div class="age-gate-card">
            <div class="logo age-gate-logo">
                <div class="logo-icon">BH</div>
                <span class="logo-text">Beer House</span>
            </div>

            <h1 class="age-gate-title">Acceso restringido</h1>
            <p class="age-gate-text">
                Este sitio es solo para mayores de {{ edad_minima }} años.
                Lo sentimos, no puedes continuar.
            </p>

            <p class="age-gate-legal">
                El exceso de alcohol es perjudicial para la salud.
                Prohibida la venta de bebidas alcohólicas a menores de {{ edad_minima }} años.
            </p>
        </div>
    </main>
</body>
</html>
