{% extends "base.html" %}
{% block title %}Iniciar sesión — Beer House{% endblock %}
{% block content %}
<h2>Iniciar sesión</h2>
<form method="POST" class="bh-form">
    <div class="bh-field">
        <label>Correo</label>
        <input type="email" name="email" required>
    </div>
    <div class="bh-field">
        <label>Contraseña</label>
        <input type="password" name="password" required>
    </div>
    <button type="submit" class="bh-btn">Ingresar</button>
</form>
<p style="margin-top:16px; color:var(--text-muted); font-size:0.88rem;">
    ¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Regístrate</a>
</p>
{% endblock %}
