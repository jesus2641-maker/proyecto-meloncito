<!-- Modal de Confirmación Genérico (Beer House) -->
<div id="confirmModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-container">
        <div class="modal-header">
            <div class="modal-icon modal-icon-warning">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
            <h2 id="confirmTitle">Cancelar pedido</h2>
        </div>
        <div class="modal-body">
            <p id="confirmMessage">¿Estás seguro de realizar esta acción?</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline" id="confirmCancel">Volver</button>
            <button type="button" class="btn btn-danger" id="confirmOk">Sí, cancelar pedido</button>
        </div>
    </div>
</div>
